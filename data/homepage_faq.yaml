- q: "What is the 2411 Glassell warehouse project?"
  a: "The 2411 Glassell warehouse project is a proposed 298,988 SF industrial warehouse and light-manufacturing building at 2411 North Glassell Street in Orange, CA, submitted by Rexford Industrial Realty. It would operate 24 hours a day, 7 days a week. The environmental studies analyzed a layout with 5 loading docks; the alternate layout in the City's document has 36 (IS/MND Table 3, p. 24). The applicant estimates 556 net new daily vehicle trips, including about 160 truck trips, for a tenant that hasn't been named."
  link: "/project/"
  linkText: "See full project specifications →"
- q: "How close is 2411 Glassell to Fletcher Mandarin Language and GATE Academy (Fletcher Elementary)?"
  a: "The 2411 Glassell warehouse site is about 1,200 feet from Fletcher Mandarin Language and GATE Academy, and 54 feet from the nearest homes along Fletcher Avenue."
  link: "/health-evidence/"
  linkText: "Read the health evidence for Fletcher →"
- q: "When is the Planning Commission hearing for 2411 Glassell?"
  a: "No hearing date has been officially noticed. The September 21, 2026 Planning Commission meeting was cancelled, and the expected date had already changed more than once before that. The next Planning Commission meetings are October 5 and October 19, 2026 at 5:30 PM; until the City posts an agenda, either could be the hearing. Every upcoming Planning Commission and City Council meeting is listed under Upcoming City Meetings on this page and kept current there; the City of Orange's own calendar at cityoforange.legistar.com is the authoritative schedule."
  link: "/#upcoming-city-meetings"
  linkText: "See upcoming City meetings →"
- q: "What are the environmental impacts of 2411 Glassell?"
  a: "The 2411 Glassell warehouse raises four major environmental concerns: air quality (a diesel cancer risk over the significance threshold before mitigation, modeled with 5 dock doors instead of 36), noise (24/7 operations with no noise mitigation proposed and the City's stricter standard for back-up alarms never applied), truck traffic and safety at a driveway the applicant's own study rates as failing, and land-use incompatibility with nearby homes and a school."
  link: "/issues/"
  linkText: "Read the full environmental issues analysis →"
