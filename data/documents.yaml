- id: scaqmd-letter
  title: "SCAQMD Comment Letter (Control No. ORC260414-01)"
  category: agency-letters
  issues: [air-quality]
  critical: true
  file: /documents/SCAQMD_Formal_Deficiency_Letter.pdf
  url: ""
  summary: "South Coast Air Quality Management District's formal comments raising seven areas of concern with the air quality analysis — air permits, outdated dispersion-model versions, a 50-hour fire-pump scenario when permits allow 200, the adjacent railroad, inapplicable screening tables, Rule 2305, and no cumulative air-toxics analysis — and noting 'unmitigated risk exceeding the threshold and mitigated risk only marginally below it' (p. 6). Pages 6–7 list recommended conditions the MND doesn't include."
  lookFor: "Page 3: model versions and the 200-hour fire pump. Page 6: 'unmitigated risk exceeding the threshold.' Pages 6–7: recommended conditions, including a cap on daily trucks at analyzed levels. Signed by Sam Wang, May 6, 2026."

