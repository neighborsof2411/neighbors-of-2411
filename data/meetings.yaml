# Upcoming City meetings -- THE one place to update dates.
#
# Rendered on the homepage by the {{< meetings >}} shortcode, which also
# fills the hero line and the "next meeting" box. Every other page links to
# the homepage section instead of repeating dates, so nothing else needs
# editing when a date moves.
#
# Add every Planning Commission and City Council meeting as the City posts
# them (calendar_url below). Meetings whose date has passed are hidden
# automatically in the browser, so old entries can be deleted whenever.
#
# Fields:
#   body      Planning Commission | City Council
#   date      "YYYY-MM-DD" (keep the quotes)
#   time      shown as written, e.g. "5:30 PM"
#   location  shown as written
#   project   confirmed | expected | tbd | not on agenda  -- is 2411 Glassell
#             on this agenda?  Use "tbd" when the City hasn't posted the
#             agenda yet and the hearing could land on this date; use
#             "not on agenda" only once the posted agenda shows it isn't.
#   agenda    "" until the City posts it, then the agenda URL
#   note      optional one-liner shown under the meeting

calendar_url: https://cityoforange.legistar.com/Calendar.aspx
upcoming:

  - body: Planning Commission
    date: "2026-10-05"
    time: "5:30 PM"
    location: City Council Chamber, Orange City Hall, 300 E. Chapman Avenue, Orange, CA 92866
    project: tbd
    agenda: ""
    note: The September 21 meeting was cancelled, and no new hearing date has been noticed. The City has committed in writing to mail notice to property owners within 300 feet and post the site at least 10 days before any hearing. If no notice has arrived by about September 25, this meeting is unlikely to be the hearing. Come anyway — public comment is open.

  - body: City Council
    date: "2026-10-13"
    time: "6:00 PM"
    location: City Council Chamber, Orange City Hall, 300 E. Chapman Avenue, Orange, CA 92866
    project: not on agenda
    agenda: ""
    note: Regular session. Council is the appeal body — the project can only reach it after the Planning Commission acts and its decision is appealed, so don't expect it on this agenda. Public comment is open at every meeting regardless, and it helps for Council to hear from the neighborhood before it ever lands in front of them.

  - body: Planning Commission
    date: "2026-10-19"
    time: "5:30 PM"
    location: City Council Chamber, Orange City Hall, 300 E. Chapman Avenue, Orange, CA 92866
    project: tbd
    agenda: ""
    note: The following Planning Commission meeting. Until the City posts an agenda, either October date could be the hearing — come to both if you can.

  - body: City Council
    date: "2026-10-27"
    time: "6:00 PM"
    location: City Council Chamber, Orange City Hall, 300 E. Chapman Avenue, Orange, CA 92866
    project: not on agenda
    agenda: ""
    note: Regular session. Council is the appeal body — the project can only reach it after the Planning Commission acts and its decision is appealed, so don't expect it on this agenda. Public comment is open at every meeting regardless, and it helps for Council to hear from the neighborhood before it ever lands in front of them.
